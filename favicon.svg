<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="epeSquircle">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <linearGradient id="epeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#011027" />

  <!-- High-Resolution EPE Brand Logo Image (Perfect Center) -->
  <image href="data:image/png;base64," width="64" height="64" clip-path="url(#epeSquircle)" preserveAspectRatio="xMidYMid slice" />

  <!-- Outer Ring Glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#epeBorder)" stroke-width="1.6" stroke-opacity="0.8" />
</svg>
